# Tauri backend — active quand Rust + MSVC sont installes.
# En attendant, l'app tourne 100 % offline en mode web via sql.js
# avec exactement le meme schema SQL (voir src/lib/db.ts).
# Migration web -> Tauri : installer Rust, puis `npm run tauri dev`.
# La couche src/lib/db.ts basculera sur tauri-plugin-sql sans changer les requetes.

[package]
name = "gestion-papa"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
